name: Learning CI

on:
  pull_request:
    paths:
      - ".github/workflows/learning-ci.yml"
      - "packages/learning/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/learning-ci.yml"
      - "packages/learning/**"

permissions:
  contents: read

jobs:
  test:
    name: Learning checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/learning/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run schema:check
      - run: npm test
      - run: npm run demo
      - run: npm run demo:agent-memory-repo
