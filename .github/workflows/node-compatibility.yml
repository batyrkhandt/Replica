name: Node compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/extensions/replica-prototype/**"
      - "actions/build/**"
      - "hub/app/javascript/**"
      - "hub/script/**"
      - "hub/.storybook/**"
      - "hub/*.json"
      - "hub/.npmrc"
      - "hub/*.ts"
      - "hub/*.mjs"
      - "packages/learning/**"
      - "starter/**"
      - "scripts/**"
      - "eslint.config.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/extensions/replica-prototype/**"
      - "actions/build/**"
      - "hub/app/javascript/**"
      - "hub/script/**"
      - "hub/.storybook/**"
      - "hub/*.json"
      - "hub/.npmrc"
      - "hub/*.ts"
      - "hub/*.mjs"
      - "packages/learning/**"
      - "starter/**"
      - "scripts/**"
      - "eslint.config.mjs"

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15.0", "26.0.0", "26"]
        project: [hub, starter, actions/build, packages/learning]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts --engine-strict
      - name: Install Hub browser-test dependencies
        if: ${{ matrix.project == 'hub' }}
        run: npm ci --ignore-scripts --omit=dev --engine-strict
        working-directory: actions/build
      - name: Install Chromium
        if: ${{ matrix.project == 'hub' || matrix.project == 'actions/build' }}
        run: actions/build/node_modules/.bin/playwright install --with-deps chromium
        working-directory: .
      - name: Check Hub
        if: ${{ matrix.project == 'hub' }}
        run: |
          npm run lint
          npm test
          npm run controls:test
          REPLICA_CHROMIUM_PATH="$(node -p 'require("../actions/build/node_modules/playwright").chromium.executablePath()')"
          export REPLICA_CHROMIUM_PATH
          npm run extension:test
          npm run build
          npm run storybook:build
          npm run controls:assets:check
          npm run extension:assets:check
      - name: Check Starter
        if: ${{ matrix.project == 'starter' }}
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run build
      - name: Check starter setup and root scripts
        if: ${{ matrix.project == 'starter' }}
        run: node --test scripts/*.test.mjs
        working-directory: .
      - name: Check build action
        if: ${{ matrix.project == 'actions/build' }}
        run: |
          npm run lint
          npm test
      - name: Check Learning
        if: ${{ matrix.project == 'packages/learning' }}
        run: |
          npm run schema:check
          npm test
          npm run demo
          npm run demo:agent-memory-repo
