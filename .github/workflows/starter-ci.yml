name: Starter CI

on:
  pull_request:
    paths:
      - ".github/workflows/starter-ci.yml"
      - "starter/**"
      - "scripts/create-prototype-repo.sh"
      - "scripts/create-prototype-repo.test.mjs"
      - "scripts/setup-replica-plugin.test.mjs"
      - "scripts/install-starter.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/starter-ci.yml"
      - "starter/**"
      - "scripts/create-prototype-repo.sh"
      - "scripts/create-prototype-repo.test.mjs"
      - "scripts/setup-replica-plugin.test.mjs"
      - "scripts/install-starter.sh"

permissions:
  contents: read

jobs:
  test:
    name: Starter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --test scripts/create-prototype-repo.test.mjs scripts/setup-replica-plugin.test.mjs
        working-directory: .
